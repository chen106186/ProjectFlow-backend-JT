services:

  # ── Backend ──────────────────────────────────────────────────
  backend:
    image: projectflow-backend:latest
    container_name: projectflow-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST:-host.docker.internal}:${MYSQL_PORT:-3306}/${MYSQL_DB:-projectflow}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-projectflow123}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      PROJECTFLOW_JWT_SECRET: ${JWT_SECRET:-change-me-at-least-32-bytes-long!!}
      PROJECTFLOW_STORAGE_TYPE: ${PROJECTFLOW_STORAGE_TYPE:-aliyun-oss}
      PROJECTFLOW_STORAGE_LOCAL_ROOT: /app/data/uploads
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-company-project-oss}
    ports:
      - "8080:8080"

  # ── Frontend (Nginx) ─────────────────────────────────────────
  frontend:
    image: projectflow-frontend:latest
    container_name: projectflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  uploads:
