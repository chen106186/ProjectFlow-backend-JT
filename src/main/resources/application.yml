server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: projectflow-backend
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/projectflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
#  profiles:
#    active: dev

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

projectflow:
  schedule:
    # 每天凌晨 0:30 同步任务状态到数据库
    task-status-sync-cron: "0 30 0 * * ?"
  notice:
    # 每天 08:00 发送每日工作提醒
    daily-work-cron: "0 0 8 * * ?"
    # 每天 09:00 推送任务截止预警
    task-deadline-cron: "0 0 9 * * ?"
    # 每天 09:15 推送项目节点截止预警
    project-stage-deadline-cron: "0 15 9 * * ?"
    # 每周一 09:00 发送周报摘要
    weekly-summary-cron: "0 0 9 ? * MON"
  security:
    enabled: true
    dev-user-id: 1
  jwt:
    secret: "replace-with-at-least-32-byte-local-secret"
    ttl-minutes: 720
  storage:
    type: aliyun-oss
    local-root: ./data/uploads
    aliyun-oss:
      endpoint: https://oss-cn-shanghai.aliyuncs.com
      access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:local-dev-key}
      access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:local-dev-secret}
      bucket-name: ${ALIYUN_OSS_BUCKET:company-project-oss}
      object-prefix: projectflow
